[package]
name = "zeropw-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "ZeroPW desktop app: the Tauri v2 shell around zeropw-desktop-core"

[[bin]]
name = "zeropw-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.7.1"

[dependencies]
zeropw-desktop-core = { path = "../core" }
tauri = "=2.12.1"
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-single-instance = { version = "=2.5.2", features = ["deep-link"] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-clipboard-manager = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["serde"] }
