<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeroPW Onboarding</title>
<!--
  Design mockup v0.5 (approved design; service connection moved to the dashboard). Not the app. All visible copy lives in the T table in the script.
  Handoff notes for the Tauri build:
  - Fonts are bundled; no remote content. CSP default-src 'self'.
  - Window: minWidth 1100 / minHeight 740; "zoomHotkeysEnabled": true (Cmd +/−/0).
  - The agent terminal is a real PTY (Rust portable-pty + xterm.js). The app starts it with the gateway URL,
    caller token and no_proxy in the process environment (never typed, never echoed, never in shell history).
    For another macOS user the first command switches user and keeps those three variables
    (sudo --preserve-env=ZEROPW_GATEWAY_URL,ZEROPW_CALLER_TOKEN,no_proxy -u <user> -i).
  - Secrets, caller tokens and invite links are produced and held in Rust; clipboard writes are native
    (concealed/transient) with a 60 s clear attempt; recovery-code and invite views turn on content protection.
  - Passphrase scoring runs in Rust (zxcvbn); the heuristic below is a placeholder.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: dark;
  --void: #040406;
  --line: rgba(255, 255, 255, .07);
  --line-strong: rgba(255, 255, 255, .13);
  --fg: #f2f2f7;
  --fg-2: #bfbfcc;
  --fg-3: #8e8e9d;
  --fg-4: #575768;    /* non-text marks only */
  --azure: #5b8cff;
  --azure-soft: #8fb0ff;
  --iris: #9a6bff;
  --iris-soft: #c4a8ff;
  --grad: linear-gradient(120deg, #5b8cff 0%, #7a7cff 48%, #9a6bff 100%);
  --grad-btn: linear-gradient(120deg, #2868ff 0%, #5b5eff 48%, #854cff 100%);
  --glow-azure: rgba(91, 140, 255, .35);
  --glow-iris: rgba(154, 107, 255, .35);
  --warn: #f3c36f;
  --danger: #ff7a93;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", "Pretendard Variable", Pretendard, ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs-sm: 12px; --fs-md: 13.5px; --fs-base: 14px; --fs-lg: 15px; --fs-h2: 24px; --fs-h1: 38px;
  --radius-xs: 6px; --radius-sm: 10px; --radius-md: 14px; --radius-lg: 20px;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #09090c; color: var(--fg); font-family: var(--font); font-size: var(--fs-base); line-height: 1.55; -webkit-font-smoothing: antialiased; overflow: hidden; word-break: keep-all; }
button, input, select { font: inherit; color: inherit; }
::selection { background: rgba(122, 124, 255, .35); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* presentation stage (mockup only) */
.stage { position: fixed; inset: 0; background: radial-gradient(60% 50% at 50% 0%, rgba(91, 140, 255, .06), transparent 70%), #09090c; }
.stage-caption { position: absolute; top: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 18px; font: 500 11px/1 var(--mono); letter-spacing: .1em; color: var(--fg-3); }
.stage-caption b { color: var(--fg-2); font-weight: 500; }

/* window */
.window {
  position: absolute; left: 50%; top: calc(50% + 12px); width: var(--win-w, 1180px); height: var(--win-h, 780px);
  transform: translate(-50%, -50%) scale(var(--win-s, 1)); transform-origin: 50% 50%; border-radius: 14px; overflow: hidden; user-select: none;
  background: radial-gradient(55% 60% at 30% 55%, rgba(72, 58, 170, .20), transparent 70%), radial-gradient(40% 40% at 85% 8%, rgba(60, 110, 255, .08), transparent 60%), radial-gradient(80% 80% at 50% 120%, rgba(91, 140, 255, .07), transparent 60%), var(--void);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 40px 120px -30px rgba(0, 0, 0, .9), 0 0 80px -40px rgba(122, 124, 255, .35);
}
.window::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .05; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
canvas.field { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; mix-blend-mode: screen; }
#glow { image-rendering: auto; opacity: .55; }
.aura { position: absolute; left: 0; top: 0; width: 1024px; height: 1024px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(91,140,255,.17) 0%, rgba(122,110,255,.11) 30%, rgba(154,107,255,.05) 50%, transparent 70%); mix-blend-mode: screen; will-change: transform, opacity; transform-origin: 0 0; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0, 0, 0, .55) 100%); }

/* titlebar */
.titlebar { position: absolute; left: 0; right: 0; top: 0; height: 44px; z-index: 6; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 16px; }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #2b2b33; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.08); }
.window:hover .lights i:nth-child(1) { background: #ff5f57; }
.window:hover .lights i:nth-child(2) { background: #febc2e; }
.window:hover .lights i:nth-child(3) { background: #28c840; }
.brand { display: flex; align-items: center; gap: 8px; font: 600 11px/1 var(--mono); letter-spacing: .24em; color: var(--fg-2); margin-left: 8px; }
.brand svg { display: block; }
.tb-spacer { flex: 1; }
.status-pill { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.02); font-size: var(--fs-sm); color: var(--fg-2); white-space: nowrap; }
.status-pill .dot { width: 6px; height: 6px; border-radius: 1px; background: var(--fg-4); flex: none; }
.status-pill.live .dot { background: var(--azure); box-shadow: 0 0 8px var(--azure); animation: blink 2.4s var(--ease-in-out) infinite; }
.status-pill .mono { font: 500 11px/1 var(--mono); color: var(--fg-3); }
@keyframes blink { 50% { opacity: .35; } }
.icon-tb { width: 26px; height: 26px; border-radius: 999px; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--fg-3); }
.icon-tb:hover { color: var(--fg); background: rgba(255,255,255,.04); }
.icon-tb:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--azure-soft); }
.icon-tb svg { width: 10px; height: 10px; }
.icon-tb[aria-pressed="true"] { color: var(--azure-soft); border-color: rgba(143,176,255,.4); }

/* progress */
.progress { position: absolute; top: 56px; left: 50%; z-index: 5; display: flex; align-items: center; gap: 12px; transform: translateX(-50%); transition: opacity .6s var(--ease-out); }
.window:not([data-onboarding]) .progress { opacity: 0; }
.segs { display: flex; gap: 4px; }
.seg { width: 22px; height: 4px; background: rgba(255,255,255,.08); position: relative; overflow: hidden; }
.seg::after { content: ""; position: absolute; inset: 0; background: var(--grad); transform: scaleX(0); transform-origin: left; transition: transform .7s var(--ease-out); }
.seg.past::after { transform: scaleX(1); opacity: .5; }
.seg.cur::after { transform: scaleX(1); }
.plabel { font: 500 11px/1 var(--mono); letter-spacing: .12em; color: var(--fg-3); }
.plabel b { color: var(--fg); font-weight: 500; }

/* reveal */
.r { opacity: 0; transform: translateY(14px); filter: blur(6px); transition: opacity .7s var(--ease-out), transform .8s var(--ease-out), filter .7s var(--ease-out); transition-delay: calc(var(--i, 0) * 60ms); }
.in .r { opacity: 1; transform: none; filter: none; }

/* welcome & finale */
.hero, .finale { position: absolute; left: 50%; z-index: 4; text-align: center; transform: translateX(-50%); transition: opacity .7s var(--ease-out), transform .9s var(--ease-out), filter .7s var(--ease-out), visibility 0s; }
.hero { top: 57%; width: 660px; }
.finale { top: 50%; width: 800px; }
.hero.away, .finale.away { opacity: 0; transform: translate(-50%, 28px); filter: blur(8px); pointer-events: none; visibility: hidden; transition: opacity .6s var(--ease-out), transform .8s var(--ease-out), filter .6s, visibility 0s linear .7s; }
.hero h1, .finale h1 { margin: 0 0 14px; font-size: var(--fs-h1); line-height: 1.22; font-weight: 650; letter-spacing: -.025em; }
.hero h1:focus, .finale h1:focus { outline: none; }
.hero h1 .soft { color: var(--fg-3); font-weight: 500; }
.hero p, .finale p { margin: 0 auto; max-width: 520px; color: var(--fg-2); font-size: var(--fs-lg); }
.hero .actions, .finale .actions { margin-top: 26px; display: flex; justify-content: center; gap: 10px; }
.finale .foot { margin-top: 16px; font-size: var(--fs-sm); color: var(--fg-3); }

/* buttons */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 42px; padding: 0 20px; border-radius: var(--radius-sm); border: 0; cursor: pointer; white-space: nowrap; font-weight: 600; font-size: var(--fs-base); transition: transform .2s var(--ease-out), box-shadow .3s var(--ease-out), background .3s, color .3s; }
.btn:active { transform: translateY(1px) scale(.99); }
.btn-primary { color: #fff; background: var(--grad-btn); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 8px 24px -10px var(--glow-iris); overflow: hidden; }
.btn-primary::before { content: ""; position: absolute; inset: 0; opacity: 0; background-image: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); background-size: 40% 100%; background-repeat: no-repeat; background-position: -60% 0; -webkit-mask: repeating-linear-gradient(90deg, #000 0 2px, transparent 2px 4px), repeating-linear-gradient(0deg, #000 0 2px, transparent 2px 4px); -webkit-mask-composite: source-in; mask-composite: intersect; }
.btn-primary:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 10px 34px -8px var(--glow-iris), 0 0 0 1px rgba(143,176,255,.25); }
.btn-primary:hover::before { opacity: 1; animation: shimmer 1.1s var(--ease-in-out); }
@keyframes shimmer { to { background-position: 160% 0; } }
.btn-primary[aria-disabled="true"] { background: rgba(255,255,255,.07); color: var(--fg-3); box-shadow: inset 0 0 0 1px var(--line-strong); cursor: not-allowed; }
.btn-primary[aria-disabled="true"]::before { display: none; }
.btn-ghost { color: var(--fg-2); background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn-ghost:hover { color: var(--fg); background: rgba(255,255,255,.06); }
.btn-text { background: none; color: var(--fg-3); padding: 0 6px; }
.btn-text:hover { color: var(--fg); }
.btn-sm { height: 32px; padding: 0 12px; font-size: var(--fs-sm); border-radius: var(--radius-xs); font-weight: 550; }
.btn:focus-visible, .btn-primary[aria-disabled="true"]:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--void), 0 0 0 4px var(--azure-soft); }
.arrow { transition: transform .3s var(--ease-out); }
.btn:hover .arrow { transform: translateX(3px); }

/* card */
.card-wrap { position: absolute; right: 44px; top: 92px; bottom: 52px; width: 452px; z-index: 4; transition: opacity .7s var(--ease-out), transform .9s var(--ease-out), filter .7s, visibility 0s; }
.card-wrap.late { transition-delay: .25s; }
.card-wrap.away { opacity: 0; transform: translateX(36px); filter: blur(8px); pointer-events: none; visibility: hidden; transition: opacity .6s var(--ease-out), transform .8s var(--ease-out), filter .6s, visibility 0s linear .7s; }
.card { position: relative; height: 100%; border-radius: var(--radius-lg); background: linear-gradient(180deg, rgba(22, 22, 33, .72), rgba(10, 10, 16, .78)); -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), inset 0 1px 0 rgba(255,255,255,.06), 0 40px 90px -30px rgba(0,0,0,.85); overflow: hidden; }
.card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 2; background: linear-gradient(150deg, rgba(91,140,255,.55), rgba(154,107,255,.10) 35%, transparent 55%, rgba(154,107,255,.30)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.step { position: absolute; inset: 0; display: flex; flex-direction: column; visibility: hidden; }
.step.in, .step.out { visibility: visible; }
.step.out .r, .step.out .nav > * { opacity: 0; transform: translateY(-10px); filter: blur(6px); transition-delay: 0ms; transition-duration: .35s; }
.step-head { flex: none; padding: 30px 32px 0; }
.step-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 22px 32px 26px; scroll-padding-bottom: 26px; -webkit-mask: linear-gradient(#000 calc(100% - 18px), transparent); mask: linear-gradient(#000 calc(100% - 18px), transparent); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.12) transparent; }
.step-head h2 { margin: 0 0 8px; font-size: var(--fs-h2); line-height: 1.3; font-weight: 650; letter-spacing: -.02em; }
.step-head h2:focus { outline: none; }
.lead { margin: 0; color: var(--fg-2); font-size: var(--fs-md); }
.nav { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 32px 22px; border-top: 1px solid var(--line); background: rgba(8,8,13,.35); }
.nav > * { opacity: 0; transition: opacity .45s var(--ease-out) .3s; }
.step.in .nav > * { opacity: 1; }

/* form */
.field { margin-bottom: 14px; }
.label { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 7px; font-size: var(--fs-sm); color: var(--fg-2); font-weight: 550; }
.hint { font-size: var(--fs-sm); font-weight: 400; color: var(--fg-3); text-align: right; }
.input { position: relative; display: flex; align-items: center; height: 42px; border-radius: var(--radius-sm); background: rgba(4, 4, 8, .55); box-shadow: inset 0 0 0 1px var(--line-strong); transition: box-shadow .25s var(--ease-out), background .25s; }
.input:focus-within { background: rgba(4, 4, 8, .75); box-shadow: inset 0 0 0 1px rgba(143, 176, 255, .65), 0 0 0 4px rgba(91, 140, 255, .12); }
.input[data-invalid] { box-shadow: inset 0 0 0 1px rgba(255,122,147,.7), 0 0 0 4px rgba(255,122,147,.1); }
.input input, .input select { flex: 1; min-width: 0; height: 100%; padding: 0 14px; border: 0; outline: 0; background: transparent; font-size: var(--fs-base); }
.input select { appearance: none; cursor: pointer; }
.input select option { background: #15151f; }
.input input::placeholder { color: var(--fg-3); opacity: .85; }
.input input:disabled, .input select:disabled { color: var(--fg-3); cursor: not-allowed; }
.input.mono input, .input.mono select { font-family: var(--mono); font-size: 12.5px; }
.input .suffix { padding: 0 6px; display: flex; gap: 4px; align-items: center; }
.icon-btn { min-width: 30px; height: 30px; padding: 0 8px; display: grid; place-items: center; border-radius: var(--radius-xs); border: 0; background: transparent; color: var(--fg-3); cursor: pointer; font-size: var(--fs-sm); white-space: nowrap; }
.icon-btn:hover { color: var(--fg); background: rgba(255,255,255,.06); }
.icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--azure-soft); }
.icon-btn[aria-pressed="true"] { color: var(--azure-soft); }
.help { margin-top: 7px; font-size: var(--fs-sm); line-height: 1.5; color: var(--fg-3); }
.help.err { color: var(--danger); }
.help.warn { color: var(--warn); }
.row { display: flex; gap: 12px; }
.row > * { flex: 1; min-width: 0; }

/* meter + rules */
.meter { display: flex; align-items: center; gap: 12px; margin: 10px 0 2px; }
.cells { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; flex: 1; }
.cells i { height: 6px; background: rgba(255,255,255,.07); transition: background .35s var(--ease-out), box-shadow .35s; }
.mlabel { font-size: var(--fs-sm); color: var(--fg-2); min-width: 56px; text-align: right; }
.reason { min-height: 18px; font-size: var(--fs-sm); color: var(--fg-3); }
.rules { list-style: none; display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 0; padding: 0; }
.rule { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: var(--fs-sm); color: var(--fg-3); box-shadow: inset 0 0 0 1px var(--line); transition: color .3s, box-shadow .3s, background .3s; }
.rule .g { font: 600 11px/1 var(--mono); }
.rule.ok { color: var(--fg); background: rgba(91,140,255,.08); box-shadow: inset 0 0 0 1px rgba(143,176,255,.35); }
.rule.ok .g { color: var(--azure-soft); }

/* segmented radios */
.segmented { display: inline-flex; padding: 3px; border-radius: var(--radius-sm); background: rgba(4,4,8,.55); box-shadow: inset 0 0 0 1px var(--line-strong); position: relative; }
.field > .segmented { display: flex; width: 100%; }
.segmented label { position: relative; z-index: 1; flex: 1; display: grid; place-items: center; text-align: center; height: 36px; padding: 0 14px; color: var(--fg-3); cursor: pointer; border-radius: 7px; font-size: var(--fs-sm); font-weight: 550; white-space: nowrap; transition: color .25s; }
.segmented label.on { color: var(--fg); }
.segmented label.focus { box-shadow: 0 0 0 2px var(--azure-soft); }
.segmented label.dis { cursor: not-allowed; }
.segmented input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.segmented .thumb { position: absolute; z-index: 0; top: 3px; bottom: 3px; border-radius: 7px; background: rgba(255,255,255,.09); box-shadow: inset 0 0 0 1px rgba(143,176,255,.32), 0 0 18px -6px var(--glow-azure); transition: left .4s var(--ease-out), width .4s var(--ease-out), opacity .3s; }
.seg-sub { display: block; font-size: 11px; font-weight: 400; color: var(--fg-3); margin-top: 1px; }
.segmented label.two { height: 46px; line-height: 1.25; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 32px; padding: 0 11px; border-radius: var(--radius-xs); border: 0; cursor: pointer; font: 500 12px/1 var(--mono); color: var(--fg-3); background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px var(--line-strong); display: inline-flex; align-items: center; gap: 7px; transition: color .25s, background .25s, box-shadow .25s; }
.chip i { width: 6px; height: 6px; background: var(--fg-4); transition: background .25s, box-shadow .25s; }
.chip[aria-pressed="true"] { color: var(--fg); background: rgba(91,140,255,.10); box-shadow: inset 0 0 0 1px rgba(143,176,255,.45); }
.chip[aria-pressed="true"] i { background: var(--azure); box-shadow: 0 0 6px var(--azure); }
.chip[data-state="confirm"] { background: rgba(154,107,255,.12); box-shadow: inset 0 0 0 1px rgba(196,168,255,.5); }
.chip[data-state="confirm"] i { background: var(--iris); box-shadow: 0 0 6px var(--iris); }
.chip .req { font-family: var(--font); font-size: 11px; color: var(--iris-soft); }
.chip .req:empty { display: none; }
.chip:focus-visible { outline: none; box-shadow: inset 0 0 0 1px var(--azure-soft), 0 0 0 3px rgba(91,140,255,.25); }

/* checkbox */
.check { display: flex; gap: 10px; align-items: center; cursor: pointer; font-size: var(--fs-md); color: var(--fg-2); margin-top: 14px; }
.check input { appearance: none; margin: 0; width: 18px; height: 18px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); background: rgba(4,4,8,.55); display: grid; place-items: center; cursor: pointer; flex: none; }
.check input:checked { background: var(--grad-btn); box-shadow: none; }
.check input:checked::after { content: ""; width: 6px; height: 6px; background: #fff; }
.check input:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--azure-soft); }

/* disclosure */
details.more { margin: 4px 0 0; }
details.more summary { list-style: none; cursor: pointer; padding: 6px 0; font-size: var(--fs-sm); color: var(--fg-3); display: inline-flex; gap: 6px; align-items: center; border-radius: var(--radius-xs); }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "▸"; transition: transform .25s; }
details.more[open] summary::before { transform: rotate(90deg); }
details.more summary:hover { color: var(--fg); }
details.more summary:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--azure-soft); }
details.more .inner { padding: 8px 0 0; }

/* recovery code */
.groups { list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 8px; padding: 0; transition: filter .3s; }
.groups li { height: 42px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 10px; padding: 0 12px; background: rgba(4,4,8,.5); box-shadow: inset 0 0 0 1px var(--line); font: 600 15px/1 var(--mono); letter-spacing: .16em; opacity: 0; transform: translateY(6px) scale(.98); transition: opacity .45s var(--ease-out), transform .45s var(--ease-out); }
.groups li.on { opacity: 1; transform: none; }
.groups li span { font: 500 11px/1 var(--mono); letter-spacing: 0; color: var(--fg-3); }
.groups.hide, .canon.hide { filter: blur(7px); }
.canon { margin: 0 0 12px; font-size: var(--fs-sm); color: var(--fg-3); transition: filter .3s; display: flex; gap: 8px; align-items: baseline; }
.canon code { font: 600 12.5px/1.4 var(--mono); color: var(--fg); letter-spacing: .06em; user-select: text; }
.tools { display: flex; gap: 6px; }
.verify-row { display: flex; gap: 10px; margin-top: 12px; }
.verify-row .field { flex: 1; margin: 0; }

/* create list: dots only */
.mk-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.mk-list li { display: flex; align-items: center; gap: 14px; padding: 9px 12px; border-radius: var(--radius-sm); font-size: var(--fs-md); color: var(--fg-3); transition: background .4s, color .4s; }
.mk-list li.active { background: rgba(91,140,255,.07); color: var(--fg); }
.mk-list li.done { color: var(--fg); }
.mk-list .px { width: 10px; height: 10px; flex: none; background: var(--fg-4); transition: all .4s var(--ease-out); }
.mk-list li.active .px { background: var(--azure); box-shadow: 0 0 10px var(--azure); }
.mk-list li.done .px { background: var(--iris); box-shadow: 0 0 8px var(--iris); }
.mk-list .mono { margin-left: auto; font: 500 11.5px/1 var(--mono); color: var(--fg-3); }

/* callouts: amber = loss or exposure that cannot be undone; azure = information */
.callout { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 10px 12px; border-radius: var(--radius-md); font-size: var(--fs-sm); line-height: 1.55; color: var(--fg-2); background: rgba(243,195,111,.06); box-shadow: inset 0 0 0 1px rgba(243,195,111,.2); }
.callout .px { width: 7px; height: 7px; margin-top: 6px; background: var(--warn); flex: none; box-shadow: 0 0 8px rgba(243,195,111,.6); }
.callout.info { background: rgba(91,140,255,.06); box-shadow: inset 0 0 0 1px rgba(91,140,255,.18); }
.callout.info .px { background: var(--azure); box-shadow: 0 0 8px var(--glow-azure); }
.note { opacity: 0; transform: translateY(6px); transition: all .6s var(--ease-out); }
.note.on { opacity: 1; transform: none; }

/* terminal */
.reveal-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .6s var(--ease-out); }
.reveal-wrap.on { grid-template-rows: 1fr; }
.reveal-wrap > div { overflow: hidden; min-height: 0; }
.term { margin-top: 4px; border-radius: var(--radius-md); background: #05050a; box-shadow: inset 0 0 0 1px var(--line-strong), 0 24px 40px -28px #000; overflow: hidden; scroll-margin-bottom: 30px; }
.term-bar { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.025); }
.term-bar i { width: 8px; height: 8px; border-radius: 50%; background: #2b2b33; flex: none; }
.term-bar .tt { flex: 1; text-align: center; font: 500 11px/1 var(--mono); color: var(--fg-3); }
.term-bar .icon-btn { height: 22px; min-width: 22px; font-size: 11px; padding: 0 6px; }
.term-body { height: 188px; overflow-y: auto; padding: 10px 12px 12px; font: 12px/1.7 var(--mono); color: var(--fg-2); user-select: text; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.12) transparent; }
.term-body:focus { outline: none; }
.term:focus-within { box-shadow: inset 0 0 0 1px rgba(143,176,255,.45), 0 24px 40px -28px #000; }
.tl { white-space: pre-wrap; word-break: break-all; min-height: 20px; }
.tl .ps { color: var(--azure-soft); }
.tl.cmt { color: var(--fg-3); font-family: var(--font); }
.tl.ok { color: var(--iris-soft); font-family: var(--font); }
.tl.out { color: var(--fg-3); }
.tl.pending { cursor: pointer; margin: 0 -6px; padding: 0 6px; border-radius: 5px; background: rgba(91,140,255,.08); box-shadow: inset 0 0 0 1px rgba(143,176,255,.28); display: flex; gap: 8px; align-items: center; }
.tl.pending .c { flex: 1; color: var(--fg); }
.tl.pending:hover { background: rgba(91,140,255,.14); }
.tl .run { font: 500 11px/1 var(--font); color: #fff; background: var(--grad-btn); padding: 4px 7px; border-radius: 5px; white-space: nowrap; }
.caret { display: inline-block; width: 7px; height: 14px; background: var(--azure-soft); vertical-align: -2px; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.term-alt { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
.input .prefix { padding-left: 14px; font: 400 12px/1 var(--font); color: var(--fg-3); white-space: nowrap; }
.agent-sum { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.agent-sum span { height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 999px; font: 500 12px/1 var(--mono); color: var(--fg-2); box-shadow: inset 0 0 0 1px var(--line-strong); }
.agent-sum span.warn { color: var(--warn); box-shadow: inset 0 0 0 1px rgba(243,195,111,.3); }
.term-body { height: 248px; }

/* invite + join */
.prereq { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }
.prereq > li { border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--line); padding: 12px 14px; }
.prereq .ph { display: flex; align-items: center; gap: 10px; font-size: var(--fs-md); font-weight: 600; }
.prereq .ph .px { width: 8px; height: 8px; background: var(--fg-4); flex: none; }
.prereq li.done .ph .px { background: var(--iris); box-shadow: 0 0 8px var(--iris); }
.prereq .ph .st { margin-left: auto; font-size: var(--fs-sm); font-weight: 500; color: var(--fg-3); }
.prereq li.done .ph .st { color: var(--iris-soft); }
.prereq .pb { margin-top: 10px; }
.prereq li.done .pb { display: none; }
.inline { display: flex; gap: 8px; align-items: flex-end; }
.inline .field { flex: 1; margin: 0; min-width: 0; }
.inline > .btn { flex: none; }
.invite-box, .preview { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: center; padding: 12px; border-radius: var(--radius-md); background: rgba(2,2,5,.6); box-shadow: inset 0 0 0 1px var(--line-strong); scroll-margin-bottom: 30px; }
.invite-box:focus, .preview:focus { outline: none; box-shadow: inset 0 0 0 1px rgba(143,176,255,.6); }
.sigil { width: 92px; height: 104px; border-radius: var(--radius-sm); background: rgba(255,255,255,.02); box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.sigil svg { width: 62px; height: 62px; image-rendering: pixelated; filter: drop-shadow(0 0 8px rgba(122,124,255,.35)); }
.sigil .cap { font-size: var(--fs-sm); color: var(--fg-3); }
.link-line { font: 500 12px/1.5 var(--mono); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(255,255,255,.03); border-radius: var(--radius-xs); padding: 7px 10px; box-shadow: inset 0 0 0 1px var(--line); }
.link-line .scheme { color: var(--iris-soft); }
.link-line .mask { color: var(--fg-3); }
.fp-line { margin-top: 6px; font: 400 12px/1.4 var(--mono); color: var(--fg-2); letter-spacing: .04em; }
.ttl { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.ring { width: 28px; height: 28px; flex: none; }
.ttl .time { font: 600 15px/1 var(--mono); letter-spacing: .04em; }
.ttl .sub { font-size: var(--fs-sm); color: var(--fg-3); margin-top: 3px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 0; font-size: var(--fs-sm); }
.kv dt { color: var(--fg-3); }
.kv dd { margin: 0; color: var(--fg); font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* finale tiles */
.tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 22px 0 0; text-align: left; }
.tile { padding: 12px 12px 11px; border-radius: var(--radius-md); background: rgba(14,14,22,.6); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: inset 0 0 0 1px var(--line); }
.tile .k { font-size: var(--fs-sm); color: var(--fg-3); display: flex; align-items: center; gap: 6px; }
.tile .k i { width: 5px; height: 5px; background: var(--iris); box-shadow: 0 0 6px var(--iris); }
.tile.idle .k i { background: var(--fg-4); box-shadow: none; }
.tile.warn .k i { background: var(--warn); box-shadow: 0 0 6px rgba(243,195,111,.6); }
.tile .v { margin-top: 8px; font-size: var(--fs-md); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v small { display: block; font-size: var(--fs-sm); font-weight: 400; color: var(--fg-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.warn .v small { color: var(--warn); }

/* floating chips, hint, toast */
.node-chip { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; will-change: transform, opacity; display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 9px; border-radius: var(--radius-xs); font: 500 11px/1 var(--mono); color: var(--fg-2); background: rgba(8,8,14,.72); box-shadow: inset 0 0 0 1px var(--line-strong); white-space: nowrap; opacity: 0; }
.node-chip i { width: 5px; height: 5px; background: var(--azure); box-shadow: 0 0 6px var(--azure); }
.node-chip.peer i { background: var(--iris); box-shadow: 0 0 6px var(--iris); }
.node-chip.svc i { background: #fff; box-shadow: 0 0 6px #fff; }
.drag-hint { position: absolute; left: 0; top: 0; z-index: 3; font-size: var(--fs-sm); color: var(--fg-3); pointer-events: none; opacity: 0; transition: opacity .6s; white-space: nowrap; }
.toast { position: absolute; left: 50%; bottom: 18px; z-index: 9; transform: translate(-50%, 10px); opacity: 0; pointer-events: none; max-width: 600px; display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: var(--radius-sm); font-size: var(--fs-sm); color: var(--fg); background: rgba(18,18,28,.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1px var(--line-strong), 0 20px 40px -20px #000; transition: opacity .35s var(--ease-out), transform .45s var(--ease-out); }
.window:not([data-onboarding]) .toast { bottom: auto; top: 54px; transform: translate(-50%, -10px); }
.toast.on, .window:not([data-onboarding]) .toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast i { width: 6px; height: 6px; flex: none; background: var(--azure); box-shadow: 0 0 8px var(--azure); }
.toast.warn i { background: var(--warn); box-shadow: 0 0 8px rgba(243,195,111,.6); }
.mock-tag { position: absolute; right: 18px; bottom: 14px; z-index: 3; font: 400 10.5px/1 var(--mono); letter-spacing: .1em; color: var(--fg-3); text-transform: uppercase; opacity: .7; }

.still *, .still *::before, .still *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; transition-delay: 0s !important; animation: none !important; } }
</style>
</head>
<body>
<div class="stage">
  <footer class="stage-caption"><span><b>ZeroPW Desktop</b> · 온보딩 목업 v0.5</span><span>디자인 검토용 · 합성 값</span></footer>

  <div class="window" id="win" data-step="welcome">
    <canvas class="field" id="glow" aria-hidden="true"></canvas>
    <canvas class="field" id="field" aria-hidden="true"></canvas>
    <div class="aura" id="aura" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="titlebar">
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="brand"><span id="logo" aria-hidden="true"></span><span lang="en">ZEROPW</span></div>
      <div class="tb-spacer"></div>
      <button class="icon-tb" id="motionBtn" aria-pressed="false" data-t-aria="top.motion.aria"><svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1" width="2.4" height="8" fill="currentColor"/><rect x="6.1" y="1" width="2.4" height="8" fill="currentColor"/></svg></button>
      <span class="status-pill" id="vaultPill"><span class="dot" aria-hidden="true"></span><span id="vaultPillText" data-t="top.status.none"></span></span>
    </header>

    <div class="progress" aria-hidden="true"><div class="segs" id="segs"></div><div class="plabel" id="plabel"></div></div>
    <div class="sr-only" id="stepStatus" role="status" aria-live="polite"></div>

    <main>
      <!-- welcome -->
      <section class="hero in" id="hero" aria-labelledby="heroTitle">
        <h1 class="r" style="--i:0" id="heroTitle" tabindex="-1"><span data-t="welcome.title1"></span><br><span class="soft" data-t="welcome.title2"></span></h1>
        <p class="r" style="--i:1" data-t="welcome.sub"></p>
        <div class="actions r" style="--i:2">
          <button class="btn btn-primary" id="startBtn"><span data-t="welcome.start"></span> <span class="arrow" aria-hidden="true">→</span></button>
          <button class="btn btn-ghost" id="joinBtn" data-t="welcome.join"></button>
        </div>
      </section>

      <div class="card-wrap away" id="cardWrap">
        <div class="card" id="card">

          <!-- admin password -->
          <section class="step" data-step="admin" aria-labelledby="t-admin">
            <div class="step-head">
              <h2 class="r" style="--i:0" id="t-admin" tabindex="-1" data-t="admin.title"></h2>
              <p class="lead r" style="--i:1" data-t="admin.sub"></p>
            </div>
            <div class="step-body">
              <div class="field r" style="--i:2">
                <div class="label"><label for="adminPass" data-t="admin.field"></label></div>
                <div class="input"><input type="password" id="adminPass" autocomplete="new-password" spellcheck="false" aria-describedby="adminRules adminReason">
                  <span class="suffix"><button class="icon-btn eye" data-for="adminPass" aria-pressed="false" aria-controls="adminPass" data-t="common.show"></button></span></div>
                <div class="meter" aria-hidden="true"><div class="cells" id="adminCells"></div><span class="mlabel" id="adminLabel"></span></div>
                <div class="reason" id="adminReason"></div>
              </div>
              <div class="field r" style="--i:3">
                <div class="label"><label for="adminPass2" data-t="admin.confirm"></label></div>
                <div class="input"><input type="password" id="adminPass2" autocomplete="new-password" spellcheck="false" aria-describedby="ruleMatch"></div>
              </div>
              <ul class="rules r" style="--i:4" id="adminRules">
                <li class="rule" id="ruleLen"><span class="g" aria-hidden="true">○</span><span data-t="admin.rule.len"></span><span class="sr-only st"></span></li>
                <li class="rule" id="ruleMatch"><span class="g" aria-hidden="true">○</span><span data-t="admin.rule.match"></span><span class="sr-only st"></span></li>
                <li class="rule" id="ruleStrong"><span class="g" aria-hidden="true">○</span><span data-t="admin.rule.strong"></span><span class="sr-only st"></span></li>
              </ul>
            </div>
            <div class="nav">
              <button class="btn btn-text" data-back><span aria-hidden="true">←</span> <span data-t="common.back"></span></button>
              <button class="btn btn-primary" id="adminNext" aria-disabled="true" aria-describedby="adminRules" data-t="common.next"></button>
            </div>
          </section>

          <!-- recovery code -->
          <section class="step" data-step="recovery" aria-labelledby="t-rec">
            <div class="step-head">
              <h2 class="r" style="--i:0" id="t-rec" tabindex="-1" data-t="rec.title"></h2>
              <p class="lead r" style="--i:1" data-t="rec.sub"></p>
            </div>
            <div class="step-body">
              <div class="r" style="--i:2">
                <div id="genBox">
                  <ol class="groups" id="groups" aria-labelledby="t-rec"></ol>
                  <div class="canon" id="canon"><span data-t="rec.code.label"></span><code id="canonVal"></code></div>
                </div>
                <div id="ownBox" hidden>
                  <div class="field">
                    <div class="label"><label for="recPass" data-t="rec.own.field"></label><span class="hint" id="recHint"></span></div>
                    <div class="input mono"><input type="password" id="recPass" autocomplete="off" spellcheck="false" aria-describedby="recHint ruleRecStrong"></div>
                    <div class="meter" aria-hidden="true"><div class="cells" id="recCells"></div><span class="mlabel" id="recLabel"></span></div>
                  </div>
                  <div class="field">
                    <div class="label"><label for="recPass2" data-t="admin.confirm"></label></div>
                    <div class="input mono"><input type="password" id="recPass2" autocomplete="off" spellcheck="false" aria-describedby="ruleRecMatch"></div>
                  </div>
                  <ul class="rules" style="margin-bottom:10px">
                    <li class="rule" id="ruleRecStrong"><span class="g" aria-hidden="true">○</span><span data-t="rec.own.rule.strong"></span><span class="sr-only st"></span></li>
                    <li class="rule" id="ruleRecMatch"><span class="g" aria-hidden="true">○</span><span data-t="admin.rule.match"></span><span class="sr-only st"></span></li>
                  </ul>
                </div>
                <div class="tools">
                  <button class="btn btn-ghost btn-sm" id="regen" data-t="rec.regen"></button>
                  <button class="btn btn-text btn-sm" id="ownToggle" aria-expanded="false" aria-controls="ownBox" data-t="rec.own"></button>
                </div>
              </div>
              <div class="callout r" style="--i:3"><span class="px" aria-hidden="true"></span><span data-t="rec.warn"></span></div>
              <label class="check r" style="--i:4"><input type="checkbox" id="recAck"> <span data-t="rec.ack"></span></label>
              <div id="verifyBox" hidden>
                <div class="verify-row">
                  <div class="field"><div class="label"><label for="v1" id="v1l"></label></div><div class="input mono"><input id="v1" maxlength="4" autocomplete="off" spellcheck="false" autocapitalize="characters"></div></div>
                  <div class="field"><div class="label"><label for="v2" id="v2l"></label></div><div class="input mono"><input id="v2" maxlength="4" autocomplete="off" spellcheck="false" autocapitalize="characters"></div></div>
                </div>
              </div>
            </div>
            <div class="nav">
              <button class="btn btn-text" data-back><span aria-hidden="true">←</span> <span data-t="common.back"></span></button>
              <button class="btn btn-primary" id="recNext" aria-disabled="true"><span data-t="rec.next"></span> <span class="arrow" aria-hidden="true">→</span></button>
            </div>
          </section>

          <!-- create -->
          <section class="step" data-step="create" aria-labelledby="t-create">
            <div class="step-head">
              <h2 class="r" style="--i:0" id="t-create" tabindex="-1" data-t="create.title.run"></h2>
            </div>
            <div class="step-body">
              <ul class="mk-list r" style="--i:1" id="mkList">
                <li><span class="px" aria-hidden="true"></span><span data-t="create.item.1"></span><span class="sr-only st"></span></li>
                <li><span class="px" aria-hidden="true"></span><span data-t="create.item.2"></span><span class="sr-only st"></span></li>
                <li><span class="px" aria-hidden="true"></span><span data-t="create.item.3"></span><span class="sr-only st"></span></li>
                <li><span class="px" aria-hidden="true"></span><span data-t="create.item.4"></span><span class="sr-only st"></span></li>
                <li><span class="px" aria-hidden="true"></span><span data-t="create.item.5"></span><span class="sr-only st"></span></li>
                <li><span class="px" aria-hidden="true"></span><span data-t="create.item.6"></span><span class="sr-only st"></span></li>
                <li><span class="px" aria-hidden="true"></span><span data-t="create.item.7"></span><span class="mono">127.0.0.1:47380</span><span class="sr-only st"></span></li>
              </ul>
              <div class="callout note" id="createdNote" hidden><span class="px" aria-hidden="true"></span><span data-t="create.note"></span></div>
            </div>
            <div class="nav">
              <span></span>
              <button class="btn btn-primary" id="createNext" aria-disabled="true" data-t="common.next"></button>
            </div>
          </section>

          <!-- project -->
          <section class="step" data-step="project" aria-labelledby="t-proj">
            <div class="step-head">
              <h2 class="r" style="--i:0" id="t-proj" tabindex="-1" data-t="proj.title"></h2>
            </div>
            <div class="step-body">
              <div class="field r" style="--i:1">
                <div class="label"><label for="projName" data-t="proj.name"></label></div>
                <div class="input mono" id="projBox"><input id="projName" value="demo" maxlength="64" spellcheck="false" autocomplete="off" aria-describedby="projErr"></div>
                <div class="help err" id="projErr" hidden></div>
              </div>
              <div class="field r" style="--i:2">
                <div class="label"><span id="lbl-env" data-t="proj.envs"></span><span class="hint" id="envHint" data-t="proj.envs.hint"></span></div>
                <div class="chips" id="envChips" role="group" aria-labelledby="lbl-env" aria-describedby="envHint envErr">
                  <button class="chip" aria-pressed="true" data-env="dev"><i aria-hidden="true"></i>dev</button>
                  <button class="chip" aria-pressed="true" data-env="staging"><i aria-hidden="true"></i>staging</button>
                  <button class="chip" aria-pressed="true" data-env="prod"><i aria-hidden="true"></i>prod</button>
                </div>
                <div class="help err" id="envErr" hidden></div>
              </div>
            </div>
            <div class="nav">
              <button class="btn btn-text" data-back><span aria-hidden="true">←</span> <span data-t="common.back"></span></button>
              <button class="btn btn-primary" id="projNext" data-t="proj.next"></button>
            </div>
          </section>

          <!-- connection -->
          <section class="step" data-step="connect" aria-labelledby="t-conn">
            <div class="step-head">
              <h2 class="r" style="--i:0" id="t-conn" tabindex="-1" data-t="conn.title"></h2>
              <p class="lead r" style="--i:1" data-t="conn.sub"></p>
            </div>
            <div class="step-body">
              <div class="r" style="--i:2; margin-bottom:16px; display:flex; align-items:center; gap:10px">
                <div class="segmented" data-radio="connType" role="radiogroup" data-t-aria="conn.type.aria">
                  <span class="thumb" aria-hidden="true"></span>
                  <label class="on"><input type="radio" name="connType" value="http" checked>API</label>
                  <label><input type="radio" name="connType" value="ssh">SSH</label>
                </div>
                <div style="flex:1"></div>
                <div class="input mono" style="height:36px; width:118px"><select id="envSelConn" data-t-aria="conn.env"></select></div>
              </div>
              <div id="httpFields" class="r" style="--i:3">

/* ---------- agent + in-app terminal
   The app opens a real terminal whose environment already holds the relay address and the token.
   The user runs each pre-filled command with Enter or a click. The token is never shown or typed. */
function enterAgent() {
  const has = !!state.conn; $('#ttlF').style.visibility = has ? '' : 'hidden'; $('#noGrant').hidden = has;
}
const Term = (() => {
  const body = $('#termBody'); let steps = [], user = 'me', pending = null, busy = false, onDone = null;
  const wait = ms => new Promise(r => setTimeout(r, Field.motionOn ? ms : 0));
  function line(cls, ...parts) { const d = document.createElement('div'); d.className = 'tl ' + cls; d.append(...parts); body.appendChild(d); body.scrollTop = body.scrollHeight; return d; }
  function span(cls, text) { const s = document.createElement('span'); s.className = cls; s.textContent = text; return s; }
  const prompt = () => span('ps', `${user}@mac ~ % `);
  function next() {
    while (steps.length && steps[0].cmt) line('cmt', '# ' + steps.shift().cmt);
    if (!steps.length) { line('', prompt(), span('caret', '')); line('cmt', '# ' + t('term.next')); onDone && onDone(); return; }
    const s = steps[0], run = span('run', t('term.run') + ' ↵');
    pending = line('pending', prompt(), span('c', s.cmd), run);
    pending.addEventListener('click', exec);
  }
  async function exec() {
    if (busy || !pending) return; busy = true;
    const s = steps.shift(), el = pending; pending = null;
    el.classList.remove('pending'); el.lastChild.remove(); el.removeEventListener('click', exec);
    for (const o of s.out) {
      await wait(o.delay || 180);
      if (o.append) { body.lastChild.append(o.append); continue; }
      line(o.cls || 'out', o.text);
    }
    if (s.becomes) user = s.becomes;
    busy = false; next();
  }
  body.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); exec(); } });
  return {
    start(list, startUser, cb) { body.textContent = ''; steps = list.slice(); user = startUser; onDone = cb; busy = false; next(); },
    focus() { body.focus({ preventScroll: true }); },
  };
})();
$('#agentNext').addEventListener('click', () => {

  const where = radioVal('where');

  const name = $('#agentId').value || 'agent-1', other = where === 'other', u = ($('#agentUser').value || 'agent').replace(/[^a-z0-9._-]/gi, '');
  state.agent = { id: name, token: 'zpwc_' + b64u(43), ttl: radioVal('ttl'), where };
  Field.chipText('agent', name);
  $('#agentId').disabled = true; $('#agentUser').disabled = true; ttlSeg.lock(true); whereSeg.lock(true);
  $('#termTitle').textContent = t('term.title', { name });
  const c = state.conn;
  const listOut = c
    ? [{ text: `{"connections":[{"id":"${c.id}","kind":"${c.kind}"${c.kind === 'http' ? `,"methods":${JSON.stringify(c.methods)}` : `,"user":"${c.user}"`}}]}`, delay: 260 }, { cls: 'ok', text: '✓ ' + t('term.ok'), delay: 220 }]

  $('#agentForm').hidden = true; sum.hidden = false;

});
$('#termAltBtn').addEventListener('click', () => { const alt = $('#termAlt'), open = alt.hidden; alt.hidden = !open; $('#termAltBtn').setAttribute('aria-expanded', open); });

// ---------- finale

  const stale = a && c && state.team.shared;
  const T5 = state.join ? [
    [t('done.tile.vault'), t('done.tile.vault.v'), t('done.tile.vault.s'), 'on'],

    [t('done.tile.conn'), c ? c.id : t('done.tile.none'), c ? `${c.env} · ${c.kind === 'ssh' ? 'ssh' : c.auth}` : t('done.tile.addLater'), c ? 'on' : 'idle'],

function sigil(fp) {

  for (let y = 0; y < 11; y++) for (let x = 0; x < 6; x++) if (rn() < 0.48) { s += `<rect x="${x}" y="${y}" width="1" height="1" fill="url(#sg)"/>`; if (x < 5) s += `<rect x="${10 - x}" y="${y}" width="1" height="1" fill="url(#sg)"/>`; }
  return s;
}
const myFp = b32(26);
let ttlTimer = null;

  const secret = b32(488);
  state.invite = { link: `zeropw://join#${secret}`, created: Date.now(), name: $('#invName').value };
  const ll = $('#linkLine'); ll.textContent = ''; const sc = document.createElement('span'); sc.className = 'scheme'; sc.textContent = 'zeropw://join#';
  const m = document.createElement('span'); m.className = 'mask'; m.textContent = '…'; ll.append(sc, secret.slice(0, 6), m, secret.slice(-6));
  $('#sigil').innerHTML = sigil(myFp); $('#fpText').textContent = myFp.slice(0, 16).match(/.{1,4}/g).join(' ');
  Field.chipText('peer', state.invite.name);
  $('#invName').disabled = true; roleSeg.lock(true);
  $('#invWrap').inert = false; $('#invWrap').classList.add('on'); $('#invNext').textContent = t('inv.done'); ready($('#invNext'), true);
  Field.set('peer', 1); Field.ripple(0.08); toast(t('inv.created.toast'));
  const total = 24 * 3600 * 1000, arc = $('#ttlArc'); clearInterval(ttlTimer);
  const tick = () => { const left = Math.max(0, total - (Date.now() - state.invite.created)), s = Math.floor(left / 1000);
    $('#ttlTime').textContent = [s / 3600, s % 3600 / 60, s % 60].map(v => String(Math.floor(v)).padStart(2, '0')).join(':');
    arc.setAttribute('stroke-dashoffset', (75.4 * (1 - left / total)).toFixed(2)); };
  tick(); ttlTimer = setInterval(tick, 1000);
  setTimeout(() => { $('#inviteBox').focus({ preventScroll: true }); $('#inviteBox').scrollIntoView({ block: 'nearest', behavior: Field.motionOn ? 'smooth' : 'auto' }); }, 350);
});

$('#linkRevoke').addEventListener('click', () => { if (state.invite) toast(t('inv.revoke.toast'), 'warn'); });
['ifSel', 'teamPort'].forEach(id => $('#' + id).addEventListener('change', paintPre));

// ---------- join: paste or deep link → preview → create the vault → join. Never automatic.
const LINK_RE = /^zeropw:\/\/join\/?#[a-z2-7]{80,4096}$/i;
let joinPreview = null;
function checkJoin() {

}

});

function copy(text, msg) { (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(msg), () => toast(msg)); }

// Enter advances from text fields only; never while composing Hangul
addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  const tgt = e.target; if (!(tgt.tagName === 'INPUT' && !/^(checkbox|radio)$/.test(tgt.type))) return;
  const s = state.step;
  if (s === 'invite' || s === 'join' || (s === 'agent' && state.agent)) return;
  const btn = s === 'welcome' ? $('#startBtn') : $(`.step[data-step="${s}"] .nav .btn-primary`);
  if (btn) { e.preventDefault(); btn.click(); }
});
