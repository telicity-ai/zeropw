name: Rust parity candidate verification
on:
  push:
    branches: [codex/rust-full-parity]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        suite: [unit, tls, cli, e2e, data, remaining0, remaining1, signer, python]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PARITY_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: runner.os == 'Linux'
        with:
          python-version: '3.12.14'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: runner.os == 'macOS'
        with:
          repository: python/cpython
          ref: 2abcf904b8dac8c999d2b3aac76681abb333798a
          path: audit-cpython
          persist-credentials: false
      - name: Build exact CPython 3.12.14 oracle on macOS ARM
        if: runner.os == 'macOS'
        id: oracle
        shell: bash
        run: |
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          cd audit-cpython
          test "$(git rev-parse HEAD)" = 2abcf904b8dac8c999d2b3aac76681abb333798a
          ./configure --prefix="$RUNNER_TEMP/zeropw-python31214" --without-ensurepip --with-openssl="$(brew --prefix openssl@3)" --with-openssl-rpath=auto
          make -j3
          make install
          echo "$RUNNER_TEMP/zeropw-python31214/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zeropw-python31214/bin/python3.12" -c 'import sys, ssl; assert sys.version_info[:3] == (3,12,14); print(sys.version); print(ssl.OPENSSL_VERSION)'
      - name: Record exact source and tools
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git status --porcelain
          rustc --version
          cargo --version
          python3.12 --version
          python3.12 -c 'import ssl,unicodedata; print(ssl.OPENSSL_VERSION); print(unicodedata.unidata_version)'
          openssl version
          ssh -V
      - name: Formatting and strict Clippy
        if: matrix.suite == 'unit'
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -- --check
          cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Library and binary tests
        if: (success() || failure()) && matrix.suite == 'unit'
        run: cargo test --locked --manifest-path rust/Cargo.toml --lib --bins
      - name: Affected differential tests and native process E2E
        if: (success() || failure()) && matrix.suite != 'unit' && matrix.suite != 'signer' && matrix.suite != 'python'
        shell: bash
        run: |
          python3.12 - <<'PYCODE'
          import os,subprocess,sys
          from pathlib import Path
          groups={
              'tls':['gateway_tls_parity','gateway_replay_status_parity','gateway'],
              'cli':['runtime_parity_gaps','admin_expanduser_parity','cli_grant_limits_parity','cli_parity','agent_proxy_parity','agent_help','astra_cli_runtime_round2','astra_cleanup_publication_order'],
              'e2e':['response_parity_gaps','native_cli_e2e','fake_upstream'],
              'data':['python_numeric_comparison_parity','ledger_float_parity','team_envelope_parity_edges','team_oracle','team_fold','team_snapshot_version_order_parity','vault_public_parity'],
          }
          all_targets={path.stem for path in Path('rust/tests').glob('*.rs')}
          covered={target for group in groups.values() for target in group}
          assert covered <= all_targets, sorted(covered-all_targets)
          remaining=sorted(all_targets-covered)
          groups['remaining0']=remaining[::2]
          groups['remaining1']=remaining[1::2]
          assert sum(map(len,groups.values())) == len(all_targets)
          print('AUDIT_INTEGRATION_MANIFEST='+repr(groups),flush=True)
          targets=groups[os.environ['PARITY_SUITE']]
          failed=[]
          for target in targets:
              print('AUDIT_BEGIN='+target,flush=True)
              r=subprocess.run(['cargo','test','--locked','--manifest-path','rust/Cargo.toml','--test',target,'--','--nocapture'])
              print('AUDIT_END='+target+' exit='+str(r.returncode),flush=True)
              if r.returncode: failed.append(target)
          print('AUDIT_FAILED='+repr(failed),flush=True)
          sys.exit(bool(failed))
          PYCODE
      - name: Explicit signer resource probes and documentation tests
        if: matrix.suite == 'signer'
        shell: bash
        run: |
          result=0
          cargo test --locked --manifest-path rust/Cargo.toml --lib -- --ignored --test-threads=1 --nocapture || result=1
          cargo test --locked --manifest-path rust/Cargo.toml --doc || result=1
          exit "$result"
      - name: Full Python reference and harness suites
        if: matrix.suite == 'python'
        shell: bash
        run: |
          result=0
          python3.12 -m compileall -q zeropw tests harness || result=1
          python3.12 -m unittest discover -s tests -p 'test_*.py' -v || result=1
          python3.12 -m unittest discover -s harness -p 'test_*.py' -v || result=1
          exit "$result"
