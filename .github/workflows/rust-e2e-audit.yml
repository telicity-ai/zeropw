name: Rust exact-revision E2E audit
on:
  push:
    branches: [codex/rust-e2e-audit-20261002]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      AUDIT_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9d91647afe255d827971a1787c7af89a7b2964b6
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Record exact source and tools
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 9d91647afe255d827971a1787c7af89a7b2964b6
          git status --porcelain
          rustc --version
          cargo --version
          python3.12 --version
          ssh -V
      - name: Verify every integration target in deterministic shards
        shell: bash
        run: |
          python3.12 - <<'PYCODE'
          import os,pathlib,subprocess,sys
          shard=int(os.environ['AUDIT_SHARD'])
          targets=sorted(p.stem for p in pathlib.Path('rust/tests').glob('*.rs'))
          selected=targets[shard::4]
          print('AUDIT_TARGETS='+repr(selected),flush=True)
          failed=[]
          for target in selected:
              print('AUDIT_BEGIN='+target,flush=True)
              result=subprocess.run(['cargo','test','--locked','--manifest-path','rust/Cargo.toml','--test',target,'--','--nocapture'])
              print('AUDIT_END='+target+' exit='+str(result.returncode),flush=True)
              if result.returncode: failed.append(target)
          print('AUDIT_FAILED='+repr(failed),flush=True)
          sys.exit(bool(failed))
          PYCODE
      - name: Library and binary unit tests
        if: always() && matrix.shard == 0
        run: cargo test --locked --manifest-path rust/Cargo.toml --lib --bins
      - name: Explicit isolated signer resource measurements
        if: always() && matrix.shard == 1
        run: cargo test --locked --manifest-path rust/Cargo.toml --lib signer::tests:: -- --ignored --test-threads=1 --nocapture
      - name: Documentation tests
        if: always() && matrix.shard == 2
        run: cargo test --locked --manifest-path rust/Cargo.toml --doc
      - name: Formatting and strict Clippy
        if: always() && matrix.shard == 3
        shell: bash
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -- --check
          cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
