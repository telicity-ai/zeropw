name: Rust macOS full audit with exact oracle
on:
  push:
    branches: [codex/rust-e2e-audit-20261002]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      AUDIT_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9d91647afe255d827971a1787c7af89a7b2964b6
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: python/cpython
          ref: 2abcf904b8dac8c999d2b3aac76681abb333798a
          path: audit-cpython
          persist-credentials: false
      - name: Build exact CPython 3.12.14 oracle on macOS ARM
        id: oracle
        shell: bash
        run: |
          cd audit-cpython
          test "$(git rev-parse HEAD)" = 2abcf904b8dac8c999d2b3aac76681abb333798a
          ./configure --prefix="$RUNNER_TEMP/zeropw-python31214" --without-ensurepip --with-openssl="$(brew --prefix openssl@3)" --with-openssl-rpath=auto
          make -j3
          make install
          echo "$RUNNER_TEMP/zeropw-python31214/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zeropw-python31214/bin/python3.12" -c 'import sys, ssl; assert sys.version_info[:3] == (3,12,14); print(sys.version); print(ssl.OPENSSL_VERSION)'
      - name: Record exact source and tools
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 9d91647afe255d827971a1787c7af89a7b2964b6
          git status --porcelain
          rustc --version
          cargo --version
          python3.12 --version
          ssh -V
      - name: Record macOS host and kernel execution behavior
        shell: bash
        run: |
          python3.12 - <<'PYCODE'
          import os,pathlib,platform,socket,subprocess,tempfile,time,json
          print(json.dumps({'python':platform.python_version(),'gethostname':socket.gethostname(),'uname_nodename':os.uname().nodename}),flush=True)
          with tempfile.TemporaryDirectory(prefix='zeropw-audit-') as tmp:
              root=pathlib.Path(tmp)
              spaced=root/'spaced.sh'
              chained=root/'chained.sh'
              bare=root/'bare.sh'
              spaced.write_bytes(b'#! \t/bin/sh -e\nprintf spaced\n')
              chained.write_bytes(('#!'+str(spaced)+'\nprintf chained-text-never-read\n').encode())
              bare.write_bytes(b'#!/bin/sh')
              for path in (spaced,chained,bare):
                  path.chmod(0o700)
                  try:
                      r=subprocess.run([str(path)],capture_output=True,timeout=5)
                      result={'returncode':r.returncode,'stdout':r.stdout.decode(),'stderr':r.stderr.decode()}
                  except OSError as e:result={'errno':e.errno,'error':type(e).__name__}
                  print(json.dumps({'kernel_probe':path.name,'result':result}),flush=True)
          started=time.monotonic()
          try:
              r=subprocess.run(['python3.12','-c','import smtplib;print(smtplib.SMTP().local_hostname)'],capture_output=True,text=True,timeout=90)
              print(json.dumps({'smtp_hostname':r.stdout.strip(),'returncode':r.returncode,'elapsed':time.monotonic()-started}),flush=True)
          except subprocess.TimeoutExpired:
              print(json.dumps({'smtp_hostname':'timeout','elapsed':time.monotonic()-started}),flush=True)
          PYCODE
      - name: Verify every integration target in deterministic shards
        shell: bash
        run: |
          python3.12 - <<'PYCODE'
          import os,pathlib,subprocess,sys
          shard=int(os.environ['AUDIT_SHARD'])
          targets=sorted(p.stem for p in pathlib.Path('rust/tests').glob('*.rs'))
          selected=targets[shard::4]
          print('AUDIT_TARGETS='+repr(selected),flush=True)
          failed=[]
          for target in selected:
              print('AUDIT_BEGIN='+target,flush=True)
              result=subprocess.run(['cargo','test','--locked','--manifest-path','rust/Cargo.toml','--test',target,'--','--nocapture'])
              print('AUDIT_END='+target+' exit='+str(result.returncode),flush=True)
              if result.returncode: failed.append(target)
          print('AUDIT_FAILED='+repr(failed),flush=True)
          sys.exit(bool(failed))
          PYCODE
      - name: Library and binary unit tests
        if: always() && steps.oracle.outcome == 'success' && matrix.shard == 0
        run: cargo test --locked --manifest-path rust/Cargo.toml --lib --bins
      - name: Explicit isolated signer resource measurements
        if: always() && steps.oracle.outcome == 'success' && matrix.shard == 1
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml --lib signer::tests:: -- --ignored --test-threads=1 --nocapture
      - name: Documentation tests
        if: always() && steps.oracle.outcome == 'success' && matrix.shard == 2
        run: cargo test --locked --manifest-path rust/Cargo.toml --doc
      - name: Formatting and strict Clippy
        if: always() && steps.oracle.outcome == 'success' && matrix.shard == 3
        shell: bash
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -- --check
          cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
