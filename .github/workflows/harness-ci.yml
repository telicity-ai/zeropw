name: Harness CI

# Hosted jobs are opt-in; pushes and PRs must not consume hosted minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Compile harness modules
        run: python -m compileall -q harness

      - name: Run harness unit tests
        run: python -m unittest discover -s harness -p 'test_*.py' -v

  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Homebrew OpenSSL on macOS
        if: runner.os == 'macOS'
        run: echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Run installation boundary tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run the Rust verification matrix
        run: rust/verify.sh

      - name: Build and install a native release archive
        shell: bash
        run: |
          cargo build --locked --release --features bundled-openssl --manifest-path rust/Cargo.toml --bins
          case "$(uname -s):$(uname -m)" in
            Darwin:arm64) target=aarch64-apple-darwin ;;
            Darwin:x86_64) target=x86_64-apple-darwin ;;
            Linux:x86_64) target=x86_64-unknown-linux-gnu ;;
            *) exit 1 ;;
          esac
          cargo fetch --locked --manifest-path rust/Cargo.toml
          python3 scripts/dependency-licenses.py --features bundled-openssl --target "$target" --output dist/THIRD_PARTY_LICENSES.md
          python3 scripts/package-release.py --version v0.1.0 --target "$target" \
            --bin-dir rust/target/release --out-dir dist --third-party-licenses dist/THIRD_PARTY_LICENSES.md
          archive="dist/zeropw-v0.1.0-${target}.tar.gz"
          checksum=$(awk '{print $1}' "$archive.sha256")
          bash scripts/install.sh --archive "$archive" --sha256 "$checksum" --prefix "$RUNNER_TEMP/zeropw-installed"
          "$RUNNER_TEMP/zeropw-installed/bin/zeropw-agent" --help
          "$RUNNER_TEMP/zeropw-installed/bin/zeropw-admin" --help
          "$RUNNER_TEMP/zeropw-installed/bin/zeropw-demo"

      - name: Validate Homebrew source installation at this commit
        if: runner.os == 'macOS'
        run: scripts/test-homebrew.sh
