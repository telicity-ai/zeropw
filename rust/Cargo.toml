[package]
name = "zeropw"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/telicity-ai/zeropw"
homepage = "https://github.com/telicity-ai/zeropw"
description = "ZeroPW trusted process: vault, policy, audit, HTTP auth relay and SSH signer"

[lib]
path = "src/lib.rs"

[features]
bundled-openssl = ["openssl/vendored"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "unbounded_depth"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
scrypt = { version = "0.11", default-features = false }
chacha20poly1305 = "0.10"
chacha20 = "0.9"
poly1305 = "0.8"
typenum = "1"
ed25519-dalek = { version = "2", features = ["zeroize", "rand_core"] }
x25519-dalek = "2"
rand = "0.8"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
libc = "0.2"
socket2 = "0.5"
dns-lookup = "3"
stringprep = "=0.1.5"
unicode-normalization = "0.1"
punycode = "=0.4.1"
nix = { version = "0.30.1", features = ["process", "user"] }
openssl = "0.10"
close_fds = "=0.3.2"
rustix = { version = "1", features = ["process", "fs", "termios", "system", "event"] }
tempfile = "3"
regex = "1"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
signal-hook = "0.3"
rpassword = "7.4.0"
num-bigint = { version = "=0.5.1", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.8"
core-foundation = "0.10"
plist = "1"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
