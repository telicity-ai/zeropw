[package]
name = "zeropw"
version = "0.1.0"
edition = "2024"
publish = false
description = "ZeroPW trusted process: vault, policy, audit, HTTP auth relay and SSH signer (Rust port of zeropw/)"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "unbounded_depth"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
scrypt = { version = "0.11", default-features = false }
chacha20poly1305 = "0.10"
chacha20 = "0.9"
poly1305 = "0.8"
typenum = "1"
ed25519-dalek = { version = "2", features = ["zeroize", "rand_core"] }
x25519-dalek = "2"
rand = "0.8"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
libc = "0.2"
mio = { version = "1", default-features = false, features = ["os-poll", "os-ext"] }
socket2 = "0.5"
regex = "1"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
rustls-pemfile = "2"

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
